apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: greeting-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: amicus37/greeting:latest
        command: ["python3", "app.py"]
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: db
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: greeting-app
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: web
  type: NodePort

